<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22262f"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151922"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#e02020"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dffa8"/>
      <stop offset="1" stop-color="#12b545"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#84b4ff"/>
      <stop offset="1" stop-color="#1f5fe0"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#background)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="95.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- monitor -->
  <rect x="72" y="84" width="368" height="256" rx="30" fill="url(#screen)"
        stroke="#5b6478" stroke-width="16"/>
  <rect x="104" y="116" width="304" height="192" rx="12" fill="#08090d"/>

  <!-- per-channel colour bars -->
  <rect x="124" y="156" width="64" height="140" rx="12" fill="url(#red)"/>
  <rect x="224" y="128" width="64" height="168" rx="12" fill="url(#green)"/>
  <rect x="324" y="172" width="64" height="124" rx="12" fill="url(#blue)"/>

  <!-- stand -->
  <rect x="236" y="340" width="40" height="40" fill="#5b6478"/>
  <rect x="164" y="380" width="184" height="20" rx="10" fill="#5b6478"/>
</svg>
