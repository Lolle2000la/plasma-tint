name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The ICC tests validate profiles through the system lcms2 (as KWin does).
      - name: Install liblcms2
        run: sudo apt-get update && sudo apt-get install -y liblcms2-2

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest Pillow

      - name: Run tests
        run: PYTHONPATH=src pytest -q
