[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plasma-tint"
version = "0.1.0"
description = "Per-channel display colour adjustment for KDE Plasma (including HDR) via ICC/vcgt"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Luca Auer" }]
keywords = ["kde", "plasma", "kwin", "wayland", "hdr", "icc", "colour", "color", "vcgt", "display"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: K Desktop Environment (KDE)",
    "Topic :: Multimedia :: Graphics :: Color",
]
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
test = ["pytest>=7", "Pillow>=10"]

[project.urls]
Homepage = "https://github.com/Lolle2000la/plasma-tint"
Issues = "https://github.com/Lolle2000la/plasma-tint/issues"

[project.scripts]
plasma-tint = "plasma_tint.__main__:main"

[project.gui-scripts]
plasma-tint-gui = "plasma_tint.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/plasma_tint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
